<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/webp" href="{{ url_for('static', filename='Logo.webp') }}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap Detail | ALL AT A1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .detail-hero {
            padding: 6rem 1rem 4rem;
            text-align: center;
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.03), transparent);
        }

        .detail-hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 1rem;
        }

        .detail-hero p {
            max-width: 600px;
            margin: 0 auto;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .path-container {
            max-width: 1000px;
            margin: 0 auto 8rem;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 4rem;
            position: relative;
        }

        /* The vertical line connecting levels */
        .path-container::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--border-color);
            transform: translateX(-50%);
            z-index: -1;
            opacity: 0.5;
        }

        .level-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 3rem;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 3rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            position: relative;
        }

        .level-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }

        .level-info h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .level-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary-color);
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .topic-item {
            background: rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .topic-item i {
            color: var(--primary-color);
            font-size: 0.8rem;
        }

        .topic-item:hover {
            background: white;
            border-color: var(--primary-color);
            transform: scale(1.03);
        }

        @media (max-width: 900px) {
            .level-card {
                grid-template-columns: 1fr;
                gap: 2rem;
                padding: 2rem;
            }
            .path-container::before {
                left: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <img src="{{ url_for('static', filename='Logo.webp') }}" width="84" height="84" class="logo-img">
                <span class="logo-text">ALL AT A1</span>
            </a>
            <div class="nav-menu">
                <a href="/roadmaps" class="nav-link active">Back to Roadmaps</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="detail-hero">
        <div class="container">
            <div id="roadmap-icon" style="font-size: 4rem; margin-bottom: 2rem; color: var(--primary-color);"></div>
            <h1 id="roadmap-title">Loading...</h1>
            <p id="roadmap-desc"></p>
        </div>
    </header>

    <!-- Path -->
    <main class="path-container" id="path-content">
        <!-- Level: Entry -->
        <section class="level-card">
            <div class="level-info">
                <div class="level-badge">Step 1: Entry Level</div>
                <h2 id="entry-title">...</h2>
                <p id="entry-desc" style="color: var(--text-muted); line-height: 1.6;"></p>
            </div>
            <div class="topics-grid" id="entry-topics"></div>
        </section>

        <!-- Level: Intermediate -->
        <section class="level-card">
            <div class="level-info">
                <div class="level-badge" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b;">Step 2: Intermediate</div>
                <h2 id="inter-title" style="color: #f59e0b;">...</h2>
                <p id="inter-desc" style="color: var(--text-muted); line-height: 1.6;"></p>
            </div>
            <div class="topics-grid" id="inter-topics"></div>
        </section>

        <!-- Level: Advanced -->
        <section class="level-card">
            <div class="level-info">
                <div class="level-badge" style="background: rgba(139, 92, 246, 0.1); color: #8b5cf6;">Step 3: Advanced</div>
                <h2 id="adv-title" style="color: #8b5cf6;">...</h2>
                <p id="adv-desc" style="color: var(--text-muted); line-height: 1.6;"></p>
            </div>
            <div class="topics-grid" id="adv-topics"></div>
        </section>
    </main>

    <script>
        const currentSlug = "{{ slug }}";

        document.addEventListener('DOMContentLoaded', () => {
            fetch('/static/data/roadmap.json')
                .then(res => res.json())
                .then(data => {
                    const roadmap = data.find(r => r.slug === currentSlug);
                    if (!roadmap) {
                        window.location.href = '/roadmaps';
                        return;
                    }

                    // Update Hero
                    document.getElementById('roadmap-title').textContent = roadmap.title;
                    document.getElementById('roadmap-desc').textContent = roadmap.description;
                    document.getElementById('roadmap-icon').innerHTML = `<i class="${roadmap.icon}"></i>`;
                    document.title = `${roadmap.title} Roadmap | ALL AT A1`;

                    // Update Levels
                    const levels = roadmap.levels;
                    
                    // Entry
                    document.getElementById('entry-title').textContent = levels.entry.title;
                    document.getElementById('entry-desc').textContent = levels.entry.description;
                    renderTopics('entry-topics', levels.entry.topics);

                    // Intermediate
                    document.getElementById('inter-title').textContent = levels.intermediate.title;
                    document.getElementById('inter-desc').textContent = levels.intermediate.description;
                    renderTopics('inter-topics', levels.intermediate.topics);

                    // Advanced
                    document.getElementById('adv-title').textContent = levels.advanced.title;
                    document.getElementById('adv-desc').textContent = levels.advanced.description;
                    renderTopics('adv-topics', levels.advanced.topics);
                });
        });

        function renderTopics(containerId, topics) {
            const container = document.getElementById(containerId);
            topics.forEach(topic => {
                const item = document.createElement('div');
                item.className = 'topic-item';
                item.innerHTML = `<i class="fas fa-check-circle"></i> ${topic}`;
                container.appendChild(item);
            });
        }
    </script>

    <!-- Footer -->
    <footer style="margin-top: 5rem;">
        <div class="footer-content" style="text-align: center;">
            <p>&copy; 2026 ALL AT A1. Built for professional growth.</p>
        </div>
    </footer>
</body>

</html>
